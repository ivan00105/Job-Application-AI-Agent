<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV</title>
  <style>
    @page { size: A4; margin: 8mm 10mm; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.35; /* Increased from 1.15 for better readability */
      color: #000;
      font-size: 9pt;
      background: white;
    }
    .container {
      max-width: 198mm;
      width: 100%;
      margin: 0 auto;
      padding: 6px 8px;
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1.5px solid #2c3e50;
    }
    .header h1 {
      font-size: 20pt;
      color: #2c3e50;
      margin-bottom: 1px;
      font-weight: 700;
    }
    .header .contact {
      font-size: 8.5pt;
      color: #444;
    }
    .header .contact a { color: #1f6feb; text-decoration: none; }
    .section-title {
      font-size: 11pt;
      font-weight: 700;
      color: #2c3e50;
      margin: 8px 0 3px 0;
      padding-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      position: relative;
    }
    .section-title::after {
      content: '';
      position: absolute;
      left: 0; bottom: 0;
      width: 35px; height: 1.6px;
      background: #1f6feb;
      border-radius: 1px;
    }
    .section-divider {
      height: 1px;
      background: #e0e0e0;
      margin: 6px 0;
      border: none;
    }
    .item {
      margin-bottom: 8px; /* Increased from 5px */
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 3px; /* Increased from 1px */
      width: 100%;
    }
    .item-header h3 {
      font-size: 10pt;
      color: #2c3e50;
      font-weight: 600;
      flex: 1;
    }
    .item-header .date {
      font-size: 8.5pt;
      color: #666;
      font-weight: 500;
      white-space: nowrap;
      margin-left: 8px;
      flex-shrink: 0;
      text-align: right;
    }
    .item .subtitle {
      font-size: 9pt;
      color: #555;
      font-style: italic;
      margin-bottom: 3px; /* Increased from 2px */
    }
    .item ul {
      padding-left: 12px;
      margin-top: 2px;
    }
    .item li {
      margin-bottom: 3px; /* Increased from 1.5px */
      position: relative;
    }
    .item li::marker { color: #1f6feb; }
    .profile p { 
      margin-bottom: 7px; /* Increased from 5px */
    }
    .skills-group {
      margin-bottom: 3px;
      font-size: 9pt;
    }
    .skills-group strong {
      display: inline-block;
      min-width: 110px;
      color: #2c3e50;
    }
    @media print {
      body { 
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      a { color: #1f6feb !important; }
    }
    /* PDF-specific optimizations */
    * {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    body {
      orphans: 3;
      widows: 3;
    }
    .section {
      page-break-inside: avoid;
    }
    .item {
      page-break-inside: avoid;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <h1>{{FULLNAME}}</h1>
      <div class="contact">
        {{EMAIL}} | {{PHONE}} | {{LOCATION}} | 
        <a href="{{LINKEDIN}}">{{LINKEDIN_TEXT}}</a>
      </div>
    </div>

    <!-- PROFILE -->
    <div class="section">
      <div class="section-title">Profile</div>
      <p>{{PROFILE}}</p>
    </div>
    <hr class="section-divider">

    <!-- SKILLS -->
    <div class="section">
      <div class="section-title">Skills</div>
      {{SKILLS}}
    </div>
    <hr class="section-divider">

    <!-- EXPERIENCE -->
    <div class="section">
      <div class="section-title">Experience</div>
      {{EXPERIENCE}}
    </div>
    <hr class="section-divider">

    <!-- EDUCATION -->
    <div class="section">
      <div class="section-title">Education</div>
      {{EDUCATION}}
    </div>

  </div>
</body>
</html>
