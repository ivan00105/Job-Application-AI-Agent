<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application AI Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 400px;
            min-height: 300px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .container {
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .auth-section,
        .main-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            color: #333;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #4a90e2;
            color: white;
        }

        .btn-primary:hover {
            background: #357abd;
            transform: translateY(-1px);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            margin-top: 8px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .status {
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .status.info {
            background: rgba(74, 144, 226, 0.2);
        }

        .status.success {
            background: rgba(72, 187, 120, 0.2);
        }

        .status.error {
            background: rgba(245, 101, 101, 0.2);
        }

        .status.warning {
            background: rgba(255, 193, 7, 0.2);
        }

        .hidden {
            display: none;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 11px;
            opacity: 0.8;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            opacity: 0.7;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Application Agent</h1>
            <p>Intelligent form filling assistant</p>
        </div>

        <!-- Authentication Section -->
        <div id="authSection" class="auth-section">
            <div class="input-group">
                <label for="apiToken">API Token</label>
                <input type="password" id="apiToken" placeholder="Paste your auth token here">
            </div>
            <button id="loginBtn" class="btn btn-primary">Connect</button>
            <div class="footer">
                <p>Get your token from the web app</p>
            </div>
        </div>

        <!-- Main Section (hidden by default) -->
        <div id="mainSection" class="main-section hidden">
            <div id="status" class="status info hidden"></div>

            <div class="input-group">
                <label for="jobUrl">Job Application URL (optional)</label>
                <input type="url" id="jobUrl" placeholder="Leave empty to use current page">
            </div>

            <button id="startBtn" class="btn btn-success">🚀 Start Auto Fill</button>
            <button id="viewMemoryBtn" class="btn btn-secondary">💾 View Saved Answers</button>

            <div id="stats" class="stats hidden">
                <div class="stat">
                    <div class="stat-value" id="totalFields">0</div>
                    <div class="stat-label">Total Fields</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="autoFilled">0</div>
                    <div class="stat-label">Auto Filled</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="needInput">0</div>
                    <div class="stat-label">Need Input</div>
                </div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
